# Ambiente local do Publication Manager.
# Portas deslocadas: 5432/5433/5434 já estão ocupadas nesta máquina.
services:
  postgres:
    image: postgres:18-alpine
    container_name: pm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm
      POSTGRES_DB: publication_manager
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["pm-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d publication_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pmadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pmadmin123}
    ports:
      - "9000:9000"   # API S3
      # Console admin: só em 127.0.0.1, nunca exposto na rede (item 37 do spec).
      - "127.0.0.1:9001:9001"
    volumes: ["pm-minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria o bucket e o deixa pronto. Roda uma vez e sai.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pmadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pmadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-publication-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo "bucket $$MINIO_BUCKET pronto"
      "

  # app e worker ficam atrás do profile "completo": o fluxo normal de
  # desenvolvimento é rodá-los na máquina (npm run dev / npm run worker), com
  # recarregamento rápido. Use o profile pra provar o ambiente inteiro em Docker:
  #   docker compose --profile completo up
  app:
    profiles: ["completo"]
    build: .
    container_name: pm-app
    command: sh -c "npx prisma migrate deploy && npm run dev"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://pm:pm@postgres:5432/publication_manager
      MINIO_ENDPOINT: minio
    ports: ["3100:3100"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    profiles: ["completo"]
    build: .
    container_name: pm-worker
    command: npm run worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://pm:pm@postgres:5432/publication_manager
      MINIO_ENDPOINT: minio
      # Um worker por vez. O lock aguenta mais de um, mas publicar em rajada
      # é ruim pro alcance — o espaçamento vem do agendamento.
      WORKER_ID: docker-worker-1
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pm-postgres:
  pm-minio:
